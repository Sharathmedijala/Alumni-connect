name: prototypefinalpakka
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  google_sign_in: ^6.1.6
  cloud_firestore: ^4.15.5 
  intl: ^0.19.0
  image_picker: ^1.1.2
  firebase_storage: ^11.7.7
  url_launcher: ^6.2.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.5

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

flutter_native_splash:
  color: "#000000" # You can change the splash background color here
  image: assets/app_icon.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/google_logo.png
    - assets/mentring.jpg
    - assets/home.jpg
